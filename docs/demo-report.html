<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentiment Agent · HKEX & KRX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8;--bg2:#eef0f3;--panel:#ffffff;--panel2:#f8f9fb;--line:#e3e6ec;--line2:#d5d9e1;
  --tx:#0e1320;--tx2:#3a4254;--mut:#6b7385;--faint:#9aa1b1;
  --up:#0f9f6e;--dn:#e5484d;--warn:#c27c0e;--acc:#4f5fe8;--acc2:#7c5cff;
  --upbg:rgba(15,159,110,.10);--dnbg:rgba(229,72,77,.10);--warnbg:rgba(194,124,14,.12);--accbg:rgba(79,95,232,.10);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--r:14px;--side:264px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme=dark]{
  --bg:#080b11;--bg2:#0c1018;--panel:#10151f;--panel2:#141a26;--line:#1d2432;--line2:#283043;
  --tx:#e8ebf2;--tx2:#c3c9d6;--mut:#8b93a7;--faint:#5c6478;
  --up:#2fd39a;--dn:#ff5c6c;--warn:#f5b84b;--acc:#7c8cff;--acc2:#a78bfa;
  --upbg:rgba(47,211,154,.11);--dnbg:rgba(255,92,108,.11);--warnbg:rgba(245,184,75,.12);--accbg:rgba(124,140,255,.12);
  --shadow:0 0 0 1px rgba(255,255,255,.02),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,-apple-system,"Segoe UI",Roboto,"Noto Sans KR","Noto Sans TC",sans-serif;-webkit-font-smoothing:antialiased}
:root[data-theme=dark] body{background:radial-gradient(1200px 600px at 70% -10%,rgba(124,140,255,.08),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(47,211,154,.05),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}a{color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}.faint{color:var(--faint)}.warn{color:var(--warn)}
.app{display:flex;height:100%}
/* ---------- sidebar ---------- */
aside{width:var(--side);flex:none;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--line);transition:margin .25s ease;z-index:30}
.app.collapsed aside{margin-left:calc(-1 * var(--side))}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 10px}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px rgba(124,140,255,.35)}
.brand b{font-weight:700;font-size:15px;letter-spacing:-.2px;display:block}.brand small{color:var(--mut);font-size:11px}
.ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}.ib:hover{background:var(--panel2);color:var(--tx)}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);padding:14px 16px 6px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;margin:1px 8px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--tx2);text-decoration:none;transition:background .15s}
.nav:hover{background:var(--panel2)}.nav.on{background:var(--panel);color:var(--tx);box-shadow:var(--shadow)}
.nav .m{margin-left:auto;font-size:12px}.nav .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.watch{flex:1;overflow:auto;min-height:0;padding-bottom:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}.dot.LONG,.dot.up{background:var(--up)}.dot.SHORT,.dot.dn{background:var(--dn)}.dot.WATCH,.dot.warn{background:var(--warn)}
.sfoot{border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}.live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.live i.on{background:var(--up);box-shadow:0 0 0 3px var(--upbg)}.live i.busy{background:var(--warn);animation:pulse 1s infinite}.live i.err{background:var(--dn)}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);font-weight:500;font-size:13px;transition:all .15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn[disabled]{opacity:.55;pointer-events:none}.btn.sm{padding:5px 10px;font-size:12px}
.row{display:flex;align-items:center;gap:8px}.sp{flex:1}
/* ---------- main ---------- */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;min-height:58px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px)}
.crumb{font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumb b{color:var(--tx);font-weight:600}.crumb a{text-decoration:none;cursor:pointer}.crumb a:hover{color:var(--tx)}
.badge{font-size:11px;font-weight:600;letter-spacing:.4px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.badge.demo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warnbg)}.badge.live{color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,transparent);background:var(--upbg)}
.fresh{font-size:12px;color:var(--mut);white-space:nowrap}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth}.wrap{max-width:1320px;margin:0 auto;padding:22px 28px 90px}
.view{animation:in .28s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---------- building blocks ---------- */
h1{font-size:28px;font-weight:700;letter-spacing:-.6px;margin:0}
h2{font-size:17px;font-weight:650;letter-spacing:-.2px;margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;color:var(--acc)}
.sub{color:var(--mut);margin-top:4px}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:34px 0 14px}
.shead p{margin:4px 0 0;color:var(--mut);font-size:13px;max-width:720px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:12px;font-weight:600;color:var(--mut);margin:0 0 12px;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g-12{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.kpi .l{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.6px;margin-top:6px;font-family:var(--mono)}
.kpi .s{font-size:12px;color:var(--faint);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:550;background:var(--panel2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:var(--upbg);color:var(--up);border-color:transparent}.chip.dn{background:var(--dnbg);color:var(--dn);border-color:transparent}.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}.chip.acc{background:var(--accbg);color:var(--acc);border-color:transparent}
.act{display:inline-flex;align-items:center;justify-content:center;min-width:62px;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.6px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.act.LONG{background:var(--upbg);color:var(--up);border-color:color-mix(in srgb,var(--up) 35%,transparent)}.act.SHORT{background:var(--dnbg);color:var(--dn);border-color:color-mix(in srgb,var(--dn) 35%,transparent)}.act.WATCH{background:var(--warnbg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.pills{display:inline-flex;gap:2px;background:var(--panel2);border:1px solid var(--line);padding:3px;border-radius:11px;max-width:100%;overflow-x:auto}
.pills button{padding:6px 12px;border-radius:8px;color:var(--mut);font-size:13px;font-weight:500;white-space:nowrap}.pills button.on{background:var(--panel);color:var(--tx);box-shadow:var(--shadow)}
.bar2{position:relative;height:6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}.bar2 i{position:absolute;top:-1px;height:6px;border-radius:3px}.bar2:after{content:"";position:absolute;left:50%;top:-4px;width:1px;height:12px;background:var(--line2)}
.mbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}.mbar i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--panel2);margin-top:12px}.split i{display:block;height:8px}
dl.kv{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:13px}dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--warn);margin-top:10px}.fn{color:var(--faint);font-size:12px;line-height:1.7;margin-top:40px;border-top:1px solid var(--line);padding-top:18px}
.empty{color:var(--mut);padding:8px 0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}.tbl tr:last-child td{border-bottom:0}
.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl td.t{font-family:inherit}.xs{overflow-x:auto}
/* ranking */
.rank{display:grid;grid-template-columns:30px minmax(170px,1.5fr) 96px 110px minmax(110px,1fr) minmax(130px,1.1fr) 120px 96px;gap:14px;align-items:center;padding:12px 14px}
.rh{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ri{border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;border-radius:10px}.ri:last-child{border-bottom:0}.ri:hover{background:var(--panel2)}
.ri .nm b{font-weight:600;display:block}.ri .nm small{color:var(--mut)}
.ri small.d{display:block;font-size:12px}
/* decision */
.dec .big{font-size:38px;font-weight:750;letter-spacing:-1px;line-height:1}
.meter{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}.meter i{display:block;height:100%;border-radius:4px}
.vote{display:grid;grid-template-columns:96px 1fr 52px;gap:10px;align-items:center;font-size:12px;color:var(--mut);margin:9px 0}
.why{margin:14px 0 0;padding:0;list-style:none;font-size:13px;color:var(--tx2)}.why li{padding:6px 0 6px 18px;position:relative;border-top:1px dashed var(--line)}.why li:first-child{border:0}.why li:before{content:"";position:absolute;left:4px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.plan div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.plan small{display:block;color:var(--mut);font-size:11px}.plan b{font-family:var(--mono);font-size:15px}
.post{padding:12px 0;border-top:1px solid var(--line)}.post:first-of-type{border:0;padding-top:0}.post .meta{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.news a{text-decoration:none;font-weight:500}.news a:hover{color:var(--acc)}
.src{display:flex;flex-direction:column;gap:12px}.src .hd{display:flex;align-items:center;gap:8px}.src .hd b{font-size:15px}
.fields{display:flex;flex-wrap:wrap;gap:5px}.fields span{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--faint);border:1px solid var(--line);text-decoration:line-through;text-decoration-color:var(--line2)}.fields span.on{color:var(--tx2);border-color:var(--line2);text-decoration:none}
.verdict{display:flex;gap:14px;align-items:flex-start}.verdict .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.chart{width:100%}.skel{background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:10px}@keyframes sk{to{background-position:-200% 0}}
.brief h4{font-size:18px;margin:2px 0 8px;letter-spacing:-.3px}.brief p{margin:6px 0;color:var(--tx2)}
/* status strip + steps */
.strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);margin-bottom:18px;font-size:13px;box-shadow:var(--shadow)}
.strip.run{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}.strip.err{border-color:color-mix(in srgb,var(--dn) 55%,var(--line));background:linear-gradient(0deg,var(--dnbg),var(--dnbg)),var(--panel)}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--warn);animation:spin .9s linear infinite;flex:none}@keyframes spin{to{transform:rotate(360deg)}}
.pbar{flex:1;min-width:140px;height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}.pbar i{display:block;height:5px;background:linear-gradient(90deg,var(--warn),#ffd27a);transition:width .5s}
.cnt{display:flex;gap:6px;flex-wrap:wrap;width:100%}.cnt span{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}.cnt b{color:var(--tx);font-weight:600;font-family:var(--mono)}
.steps{display:grid;gap:0;margin-bottom:14px}.st{display:grid;grid-template-columns:16px 230px 1fr;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);font-size:13px}.st:first-child{border:0}
.st i{width:10px;height:10px;border-radius:50%;background:var(--line2)}.st.running i{background:var(--warn);animation:pulse 1s infinite}.st.done i{background:var(--up)}.st.warn i{background:var(--warn)}.st.error i{background:var(--dn)}
.st small{color:var(--mut)}.st.pending span{color:var(--faint)}
.toast{position:fixed;right:20px;bottom:20px;z-index:50;padding:11px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 12px 32px rgba(0,0,0,.3);font-size:13px;transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;max-width:420px}
.toast.show{transform:none;opacity:1}.toast.err{border-color:var(--dn);color:var(--dn)}.toast.ok{border-color:var(--up)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);cursor:pointer;font-size:13px;margin-bottom:14px}.back:hover{color:var(--tx)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:10px}.price b{font-size:40px;font-weight:700;letter-spacing:-1.2px;font-family:var(--mono)}
.scrim{display:none}
@media(min-width:1001px){.app:not(.collapsed) #open{display:none}}
@media(max-width:1180px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.rank{grid-template-columns:28px minmax(150px,1.5fr) 96px minmax(100px,1fr) minmax(120px,1fr) 110px 92px}.rank>:nth-child(3){display:none}}
@media(max-width:1000px){aside{position:fixed;top:0;bottom:0;left:0;box-shadow:0 0 50px rgba(0,0,0,.5)}.app:not(.collapsed) .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
 .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g-21,.g-12{grid-template-columns:minmax(0,1fr)}}
@media(max-width:680px){.wrap{padding:16px 16px 80px}.g6,.g4,.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}h1{font-size:23px}.price b{font-size:32px}
 .rank{grid-template-columns:22px minmax(0,1fr) 84px 76px;gap:10px;padding:12px 6px}.rank>:nth-child(3),.rank>:nth-child(5),.rank>:nth-child(6),.rank>:nth-child(7){display:none}.rh{display:none}
 .plan{grid-template-columns:1fr 1fr}.st{grid-template-columns:16px 1fr}.st small{grid-column:2}.top{padding:10px 12px}.fresh{display:none}.vote{grid-template-columns:80px 1fr 44px}.dec .big{font-size:30px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside>
    <div class="brand">
      <div class="logo"><svg class="i" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></div>
      <div><b>Sentiment Agent</b><small>HKEX · KRX retail signal</small></div><span class="sp"></span>
      <button class="ib" id="close" aria-label="Collapse sidebar"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
    </div>
    <div class="sec">Markets</div><div id="markets"></div>
    <div class="sec">Watchlist</div><div class="watch" id="watch"></div>
    <div class="sfoot">
      <div class="live"><i id="dot"></i><span id="live">connecting</span><span class="sp"></span><span id="stamp" class="faint"></span></div>
      <div class="row"><button class="btn pri sm" id="refresh" style="flex:1"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span id="rlabel">Refresh data</span></button>
      <button class="btn sm" id="theme" aria-label="Toggle theme"><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
    </div>
  </aside>
  <main>
    <header class="top">
      <button class="ib" id="open" aria-label="Open sidebar"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="crumb" id="crumb"></div><span class="sp"></span><span class="fresh" id="fresh"></span><span class="badge" id="mode">…</span>
    </header>
    <div class="scroll" id="scroll"><div class="wrap"><div id="strip"></div><div id="view" class="view"></div></div></div>
  </main>

  <div class="shead"><div><div class="eyebrow">Social intelligence</div><h2>What the crowd is saying</h2></div></div>

   <div class="card"><h3>By source</h3><div class="faint" style="font-size:12px;margin:-4px 0 8px">Crowd sentiment ${f(t.sentiment,2)} = ${esc(t.sentiment_scope||'retail posts')}${t.pro_commentary&&t.pro_commentary.count?` · news/research commentary ${f(t.pro_commentary.sentiment,2)} from ${t.pro_commentary.count} Telegram posts (news vote)`:''}</div>${Object.entries(t.source_sentiment||{}).map(([k,v])=>{const w=Math.min(50,Math.abs(v.sentiment)/.3*50);return `<div class="vote" style="grid-template-columns:150px 1fr 96px"><span style="color:var(--tx2)">${esc(sn(k))} <span class="chip ${v.audience&&v.audience!=='retail'?'acc':''}" style="font-size:10px;padding:0 6px">${esc(v.audience||'retail')}</span></span><div class="bar2"><i style="${v.sentiment>=0?'left:50%':'right:50%'};width:${w}%;background:${v.sentiment>=0?'var(--up)':'var(--dn)'}"></i></div><span class="num" style="text-align:right">${f(v.sentiment,2)} <span class="faint">· ${v.mentions}</span></span></div>`}).join('')||'<div class="empty">No posts.</div>'}
    <h3 style="margin-top:22px">Stated positions</h3>
    <div class="split" style="height:10px;margin:0 0 10px"><i style="width:${c.long+c.short?c.long/(c.long+c.short)*100:50}%;background:var(--up)"></i><i style="width:${c.long+c.short?c.short/(c.long+c.short)*100:50}%;background:var(--dn)"></i></div>
    <dl class="kv"><dt>Long · short</dt><dd><span class="up">${c.long}</span> · <span class="dn">${c.short}</span> <span class="chip ${dc(c.bias)}">${c.bias}</span></dd>
     <dt>Authors</dt><dd>${t.authors||0}</dd><dt>Verified holders</dt><dd>${t.holder_share?f(t.holder_share*100,0)+'%':'–'}</dd><dt>Mention z-score</dt><dd>${f(t.mention_z,1)}</dd>
     <dt>Own position</dt><dd>${o?`${o.side} ${o.qty} @ ${f(o.avg_cost)} · <span class="${cls(o.pnl_pct)}">${pc(o.pnl_pct)}</span>`:'<span class="faint">none</span>'}</dd></dl></div>
   <div class="card"><h3>Sentiment by source vs price <span class="faint" style="text-transform:none;letter-spacing:0;font-weight:500">does the crowd lead or follow?</span></h3><div id="cSent" class="chart" style="height:280px"></div>
    ${Object.keys(t.themes||{}).length?`<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:10px">${Object.entries(t.themes).map(([k,v])=>Object.entries(v).slice(0,3).map(([n,x])=>`<span class="chip">${esc(k)}: ${esc(n)} ${f(x*100,0)}%</span>`).join('')).join('')}</div>`:''}</div></div>

  <div class="g g2" style="margin-top:14px">
   <div class="card"><h3>Loudest posts <span class="faint" style="text-transform:none;letter-spacing:0;font-weight:500">weighted by reach, endorsement, holder badge</span></h3>${t.top_posts.map(n=>`<div class="post"><div class="meta"><span class="chip">${esc(sn(n.src))}${n.audience&&n.audience!=='retail'?' · '+esc(n.audience):''}</span>${n.likes!=null?`<span>♥ ${n.likes}</span>`:''}${n.dislikes?`<span>✗ ${n.dislikes}</span>`:''}${n.reactions!=null?`<span>☺ ${n.reactions}</span>`:''}${n.views!=null?`<span>👁 ${n.views.toLocaleString()}</span>`:''}${n.holder?'<span class="chip up">verified holder</span>':''}<span class="sp"></span><span class="num ${cls(n.score)}">${f(n.score,2)}</span></div><div>${esc(n.text)}</div><div class="faint" style="font-size:11px;margin-top:3px">${new Date(n.ts).toLocaleString()}</div></div>`).join('')||'<div class="empty">No posts.</div>'}</div>
   <div class="card news"><h3>News intelligence · Exa <span class="chip ${dc(t.news.direction)}" style="text-transform:none;letter-spacing:0">${t.news.direction} ${f(t.news.sentiment,2)}</span></h3>${t.news.items.map(n=>`<div class="post"><div class="meta"><span>${new Date(n.ts).toLocaleDateString()}</span><span class="sp"></span><span class="chip ${n.score>.05?'up':n.score<-.05?'dn':''}">${f(n.score,2)}</span></div><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>`).join('')||'<div class="empty">No news in the window.</div>'}</div></div>

  <div class="shead"><div><div class="eyebrow">AI prediction lab</div><h2>Predicted vs realised (out-of-sample)</h2>${pt?`<p>Daily on this asset: hit-rate <b class="${pt.dir_acc>.5?'up':'dn'}">${f(pt.dir_acc*100,0)}%</b> vs technicals-only ${f(pt.dir_acc_tech*100,0)}% over ${pt.n} sessions (tiny sample).</p>`:''}</div>
   <div class="pills" id="fseg">${[['daily','Daily'],['hourly','Hourly']].map(([k,l])=>`<button data-f="${k}" class="${S.freq===k?'on':''}">${l}</button>`).join('')}</div></div>
  <div class="card"><div id="cBack" class="chart" style="height:300px"></div><h3 style="margin-top:14px">Absolute error per prediction · model vs naive</h3><div id="cErr" class="chart" style="height:170px"></div></div>
  <div class="fn">${esc(t.local_name||'')} · forecasts are model outputs, not advice. Levels: clustered swing pivots + classic pivot point.</div>`;
  charts(t);
}
function priceRef(t){const r=t.price_ref;if(!r)return '';
  return `<span class="chip" title="The forecast is computed from the last COMPLETED session close, never from a still-forming bar.">${r.market_bar_forming?'live print':'last print'} ${new Date(r.market_ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})} · model base ${f(r.model_close)} @ ${new Date(r.model_close_ts).toLocaleDateString()}${r.model_close_derived_from_hourly?' (rebuilt from hourly)':''}</span>`}
function miniKpis(t,p,h){return `<div class="card kpi"><div class="l">Next close</div><div class="v">${f(p.pred_price)}</div><div class="s"><span class="${cls(p.pred_return)}">${pc(p.pred_return*100)}</span> · 80% band ${f(p.band80[0],1)}–${f(p.band80[1],1)}</div></div>
  <div class="card kpi"><div class="l">Next hourly bar</div><div class="v">${f(h.pred_price)}</div><div class="s ${cls(h.pred_return)}">${pc(h.pred_return*100)}</div></div>
  <div class="card kpi"><div class="l">Signal agreement</div><div class="v">${t.consensus.agree}/3</div><div class="s">model · crowd · news</div></div>
  <div class="card kpi"><div class="l">Mentions</div><div class="v">${t.mentions.toLocaleString()}</div><div class="s">${Object.entries(t.by_source).map(([k,v])=>sn(k)+' '+v).join(' · ')}</div></div>`}
function forecastCard(t,p,h){return `<div class="card"><h3>n+1 forecast</h3><div class="g g2">
  <div class="kpi"><div class="l">Next close</div><div class="v">${f(p.pred_price)}</div><div class="s"><span class="${cls(p.pred_return)}">${pc(p.pred_return*100)}</span></div></div>
  <div class="kpi"><div class="l">Next hourly bar</div><div class="v">${f(h.pred_price)}</div><div class="s ${cls(h.pred_return)}">${pc(h.pred_return*100)}</div></div></div>
  <dl class="kv" style="margin-top:16px"><dt>80% band</dt><dd>${f(p.band80[0])} – ${f(p.band80[1])}</dd><dt>Technicals-only forecast</dt><dd class="${cls(p.pred_return_tech_only)}">${pc(p.pred_return_tech_only*100)}</dd>
  <dt>Signal / noise</dt><dd>${f(p.signal_to_noise,2)}</dd><dt>Agreement</dt><dd>${t.consensus.agree}/3</dd><dt>Mentions</dt><dd>${t.mentions.toLocaleString()} · z ${f(t.mention_z,1)}</dd></dl>
  <div class="faint" style="font-size:12px;margin-top:12px">Set ANTHROPIC_API_KEY to add an AI analyst brief here.</div></div>`}
function decisionCard(t){
  const d=t.decision,pl=d.plan,col=d.action==='LONG'?'--up':d.action==='SHORT'?'--dn':d.action==='WATCH'?'--warn':'--faint';
  const vote=(k,l)=>{const v=d.votes[k],w=Math.min(50,Math.abs(v)*50);return `<div class="vote"><span>${l} <span class="faint">×${d.weights[k]}</span></span><div class="bar2"><i style="${v>=0?'left:50%':'right:50%'};width:${w}%;background:${v>=0?'var(--up)':'var(--dn)'}"></i></div><span class="num" style="text-align:right">${f(v,2)}</span></div>`};
  return `<div class="card dec"><h3>${ic('bolt',14)} Agent decision · next session</h3>
   <div class="row" style="gap:16px;flex-wrap:wrap;align-items:center"><span class="big" style="color:var(${col})">${d.action}</span>
    <div style="flex:1;min-width:180px"><div class="row" style="justify-content:space-between;font-size:12px;color:var(--mut)"><span>signal strength (not a probability)</span><span class="num">${d.signal_strength}/100 · trust ×${d.trust}</span></div><div class="meter" style="margin-top:6px"><i style="width:${d.signal_strength}%;background:var(${col})"></i></div></div></div>
   ${d.reliability?`<div class="faint" style="font-size:12px;margin-top:10px">Sentiment value: <b class="${d.reliability.sentiment_value==='proven'?'up':'warn'}">${esc(d.reliability.sentiment_value)}</b> · evidence ${esc(d.reliability.evidence)} · sentiment votes ×${d.reliability.social_scale}</div>`:''}
   ${pl?`<div class="plan"><div><small>Entry</small><b>${f(pl.entry)}</b></div><div><small>Stop</small><b class="dn">${f(pl.stop)}</b></div><div><small>Target</small><b class="up">${f(pl.target)}</b></div><div><small>Reward : risk</small><b>${pl.reward_risk==null?'–':f(pl.reward_risk,2)}</b></div></div>`:'<div class="faint" style="margin-top:14px">No trade plan: evidence too weak or conflicting.</div>'}
   <div class="g g2" style="margin-top:16px;gap:20px"><div>${vote('model','Model')}${vote('crowd','Crowd')}${vote('news','News')}${vote('attention','Attention')}</div>
   <ul class="why" style="margin:0">${d.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div></div>`;
}
function briefCard(b){return `<div class="card brief"><h3>AI analyst brief <span class="chip ${b.agrees_with_action?'up':'warn'}" style="text-transform:none;letter-spacing:0">${b.agrees_with_action?'agrees with action':'challenges action'}</span></h3>
  <h4>${esc(b.headline)}</h4><p>${esc(b.thesis)}</p><div class="g g2" style="margin:12px 0"><div><div class="eyebrow" style="color:var(--up)">Bull case</div><p>${esc(b.bull_case)}</p></div><div><div class="eyebrow" style="color:var(--dn)">Bear case</div><p>${esc(b.bear_case)}</p></div></div>
  <div class="faint" style="font-size:12px">Would change my mind: ${esc(b.what_would_change_my_mind)} · ${esc(b.model||'')}</div></div>`}
function charts(t){
  const d=t.series.daily,p=t.prediction.daily,x=d.map(r=>r.t),nx=new Date(new Date(x[x.length-1]).getTime()+864e5).toISOString(),up=css('--up'),dn=css('--dn');
  const lines=[...t.levels.support.map(l=>[up,l.level,'S']),...t.levels.resistance.map(l=>[dn,l.level,'R'])];
  const sh=lines.map(([c,y])=>({type:'line',xref:'paper',x0:0,x1:1,y0:y,y1:y,line:{color:c,width:1,dash:'dot'}}));
  const an=lines.map(([c,y,k])=>({xref:'paper',x:0,y,xanchor:'left',yanchor:'bottom',text:k+' '+f(y),showarrow:false,font:{size:10,color:c}}));
  plot('cPrice',[{type:'candlestick',x,open:d.map(r=>r.o),high:d.map(r=>r.h),low:d.map(r=>r.l),close:d.map(r=>r.c),name:'Price',increasing:{line:{color:up},fillcolor:up},decreasing:{line:{color:dn},fillcolor:dn}},
    {type:'scatter',mode:'markers',x:[nx],y:[p.pred_price],name:'n+1 forecast (80% band)',marker:{size:12,color:css('--acc'),symbol:'diamond',line:{color:css('--panel'),width:2}},error_y:{type:'data',symmetric:false,array:[p.band80[1]-p.pred_price],arrayminus:[p.pred_price-p.band80[0]],color:css('--acc'),thickness:1.5,width:6}}],lay({shapes:sh,annotations:an}));
  const s=t.series.sentiment,bs=t.series.by_source||[],pal=[css('--acc'),css('--warn'),css('--up')];
  const srcs=[...new Set(bs.map(r=>r.src))];
  const traces=[{type:'bar',x:s.map(r=>r.t),y:s.map(r=>r.n),name:'Mentions',marker:{color:css('--accbg')},yaxis:'y3',hovertemplate:'%{y} posts<extra></extra>'},
    {type:'scatter',mode:'lines',x:s.map(r=>r.t),y:s.map(r=>r.close),name:'Close',line:{color:css('--faint'),width:2,dash:'dot'},yaxis:'y2'},
    ...srcs.map((k,i)=>{const r=bs.filter(x=>x.src===k);return {type:'scatter',mode:'lines+markers',x:r.map(x=>x.t),y:r.map(x=>x.sent),name:sn(k),line:{color:pal[i%3],width:2,shape:'spline'},marker:{size:6},customdata:r.map(x=>x.n),hovertemplate:sn(k)+' %{y:.2f} (%{customdata} posts)<extra></extra>'}})];
  if(!srcs.length)traces.push({type:'scatter',mode:'lines+markers',x:s.map(r=>r.t),y:s.map(r=>r.sent),name:'Sentiment',line:{color:css('--tx'),width:2}});
  plot('cSent',traces,lay({margin:{l:46,r:54,t:24,b:30},yaxis:{title:{text:'sentiment',font:{size:10}},gridcolor:css('--line'),zeroline:true,zerolinecolor:css('--line2')},
    yaxis2:{overlaying:'y',side:'right',showgrid:false,title:{text:'close',font:{size:10}}},yaxis3:{overlaying:'y',visible:false,rangemode:'tozero'}}));
  back(t);
}
function back(t){
  const b=t.prediction[S.freq].backtest,x=b.map(r=>r.t);
  plot('cBack',[{x,y:b.map(r=>r.actual),name:'Actual',line:{color:css('--tx'),width:2}},{x,y:b.map(r=>r.pred),name:'Model',line:{color:css('--acc'),width:2}},{x,y:b.map(r=>r.naive),name:'Naive (no change)',line:{color:css('--faint'),dash:'dot'}}],lay());
  const e=r=>Math.abs(r.pred-r.actual)/r.actual*100,en=r=>Math.abs(r.naive-r.actual)/r.actual*100;
  plot('cErr',[{type:'bar',x,y:b.map(e),name:'Model |error| %',marker:{color:css('--acc')}},{type:'bar',x,y:b.map(en),name:'Naive |error| %',marker:{color:css('--line2')}}],
    lay({barmode:'group',margin:{l:46,r:14,t:6,b:28},legend:{orientation:'h',y:1.25,x:0,font:{size:11}}}));
}

/* ================= pipeline status, refresh, retry ================= */
const isRunning=s=>!!s&&(s.running||(s.state==='running'&&!s.finished_at&&Date.now()-new Date(s.started_at)<36e5));
const errOf=s=>s&&(s.last_error||(s.state==='error'?s.error:null));
function counters(c){if(!c)return '';const sp=(l,v,x='')=>`<span>${l} <b>${v}</b>${x}</span>`;
  return `<div class="cnt">${sp('assets',`${c.assets||0}/${c.assets_total||0}`)}${c.jobs_total?sp('collection jobs',`${c.jobs_done||0}/${c.jobs_total}`):''}
  ${c.executions_started?sp('actor runs',`${c.executions_done||0}/${c.executions_started}`,c.expansions?` · ${c.expansions} reply hops`:''):''}${c.cache_hits?sp('cache hits',c.cache_hits):''}
  ${c.actor_failures?`<span class="dn">failures <b class="dn">${c.actor_failures}</b></span>`:''}${c.raw_records?sp('raw records',c.raw_records.toLocaleString()):''}${sp('posts kept',(c.posts||0).toLocaleString())}
  ${sp('Exa',`${c.exa_ok||0} ok`,c.exa_errors?` · <b class="dn">${c.exa_errors} failed</b>`:'')}${sp('news',c.news||0)}</div>`}
function steps(s){return `<div class="steps">${s.steps.map(x=>`<div class="st ${x.status}"><i></i><span>${esc(x.label)}</span><small>${esc(x.detail||'')}${x.seconds!=null&&x.status!=='running'?' · '+x.seconds+'s':''}</small></div>`).join('')}</div>`}
function strip(){
  const s=S.status,el=$('#strip');if(!s||!S.data){el.innerHTML='';return}
  const err=errOf(s);
  if(isRunning(s)&&s.steps){const k=s.steps.filter(x=>x.status==='done'||x.status==='warn').length,cur=Math.min(k+1,s.steps.length);
    el.innerHTML=`<div class="strip run"><span class="spin"></span><b>Step ${cur} of ${s.steps.length}</b><span>${esc(s.message)}</span><span class="faint">${esc(s.mode||'')} run · showing last report meanwhile</span><div class="pbar" title="steps completed (coarse, not time-based)"><i style="width:${k/s.steps.length*100}%"></i></div>${counters(s.counters)}</div>`}
  else if(err)el.innerHTML=`<div class="strip err"><b>Last refresh failed</b><span>${esc(err)}</span><span class="faint">showing last good report</span><span class="sp"></span><button class="btn sm retry">Retry</button></div>`;
  else el.innerHTML='';
}
function waiting(){
  const s=S.status,err=errOf(s);
  $('#crumb').innerHTML='<b>Building report</b>';
  $('#view').innerHTML=`<div class="eyebrow">${err?'Pipeline error':'Pipeline running'}</div><h1 style="margin-top:6px">${err?'The first run failed':'Building the first report'}</h1>
   <div class="sub">${s?esc(err||s.message):'Connecting to the pipeline…'}${s&&s.mode?` · ${esc(s.mode)} mode`:''}</div>
   ${s&&s.steps?`<div class="card" style="margin-top:18px">${steps(s)}${counters(s.counters)}</div>`:'<div class="card skel" style="height:220px;margin-top:18px"></div>'}
   ${err?'<div class="row" style="margin-top:16px;flex-wrap:wrap"><button class="btn pri retry">Retry run</button><span class="faint" style="font-size:12px">The step marked red names what failed. Check .env keys and config.yaml.</span></div>':''}`;
}
function adminKey(){try{return localStorage.getItem('adminKey')||''}catch(e){return ''}}
async function refresh(btn){
  if(FILE){toast('Offline report: start the server to refresh.');return}
  const label=btn&&btn.innerHTML;if(btn){btn.disabled=true;btn.textContent='Starting…'}
  try{
    let r=await fetch('/api/refresh',{method:'POST',headers:{'X-Admin-Key':adminKey()}});
    if(r.status===401){const k=prompt('This server requires an admin key to refresh:');if(k){try{localStorage.setItem('adminKey',k)}catch(e){}r=await fetch('/api/refresh',{method:'POST',headers:{'X-Admin-Key':k}})}}
    const j=await r.json().catch(()=>({}));
    if(r.ok)toast('Refresh started. Progress appears at the top.','ok');
    else if(r.status===409)toast('A run is already in progress.');
    else toast('Refresh rejected: '+(j.detail||j.reason||r.status),'err');
  }catch(e){toast('Server unreachable: '+e.message,'err')}
  finally{if(btn){btn.disabled=false;btn.innerHTML=label}}
}

/* ================= interactions ================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'),k=e.target.closest('#sort button'),q=e.target.closest('#fseg button'),l=e.target.closest('#labf button'),r=e.target.closest('.retry');
  if(r){refresh(r);return}
  if(g){go(g.dataset.go,g.dataset.t);if(innerWidth<=1000)side(true);$('#scroll').scrollTop=0}
  if(k){S.sort=k.dataset.k;render()}
  if(l){S.labfreq=l.dataset.l;document.querySelectorAll('#labf button').forEach(b=>b.classList.toggle('on',b===l));$('#lab').innerHTML=lab(S.data.exchanges[S.ex])}
  if(q){S.freq=q.dataset.f;document.querySelectorAll('#fseg button').forEach(b=>b.classList.toggle('on',b===q));back(S.data.exchanges[S.ex].tickers.find(t=>t.ticker===S.t))}
});
const side=v=>{$('#app').classList.toggle('collapsed',v);try{localStorage.setItem('side',v?'0':'1')}catch(e){}};
$('#close').onclick=()=>side(true);$('#open').onclick=()=>side(!$('#app').classList.contains('collapsed'));$('#scrim').onclick=()=>side(true);
$('#refresh').onclick=e=>refresh(e.currentTarget);
function theme(m){document.documentElement.dataset.theme=m;try{localStorage.setItem('theme',m)}catch(e){}if(S.data)render()}
$('#theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
let saved=null,sv=null;try{saved=localStorage.getItem('theme');sv=localStorage.getItem('side')}catch(e){}
theme(saved||'dark');
if(innerWidth<=1000||sv==='0')$('#app').classList.add('collapsed');
function live(){
  if(!window.EventSource||FILE){$('#live').textContent='Offline report';$('#dot').className='';return}
  const es=new EventSource('/api/stream');
  const on=(e,reload)=>{const s=JSON.parse(e.data),r=isRunning(s),er=errOf(s);S.status=s;S.running=r;
    $('#dot').className=r?'busy':er?'err':'on';$('#live').textContent=r?'Refreshing…':er?'Last run failed':'Live';$('#rlabel').textContent=r?'Running…':'Refresh data';
    if(reload)load();else if(!S.data)waiting();strip()};
  es.addEventListener('update',e=>on(e,true));es.addEventListener('status',e=>on(e,false));
  es.onerror=()=>{$('#dot').className='';$('#live').textContent='Reconnecting…'};
}
addEventListener('hashchange',()=>S.data&&route());load();live();
setInterval(()=>{if(S.data)$('#fresh').textContent='Report '+ago(S.data.generated_at)+' · '+S.data.sentiment_backend+' labels'},60000);
</script>
